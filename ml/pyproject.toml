[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karyon-ml"
version = "1.0.0"
description = "Training, evaluation and ONNX export for the Karyon nucleus segmentation model"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "monai>=1.3",
  "pillow>=10",
  "pyyaml>=6",
  "onnx>=1.15",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["karyon_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 140
